
# ============================================================
# AMD MI300X  —  CAMEL IllustrisTNG  (parallel job alongside atlas)
# ------------------------------------------------------------
# Hardware  : 1× MI300X  |  192 GB HBM3  |  20 vCPU  |  240 GB RAM
#
# Data  : 11 float32 fields/particle (x,y,z, vx,vy,vz,
#         density, mass, internal_energy, electron_abundance, metallicity)
#         ~200 MB binary slice → ~15 GB for full CV suite
# Download:
#   python experiments/camel_experiment/download.py --all-steps
#
# Runs concurrently alongside atlas on the same MI300X.
# Resource split (atlas + camel):
#   VRAM   : ~5 GB + ~3 GB = ~8 GB  /  192 GB  →  4% used  (no conflict)
#   RAM    : ~16 GB + ~15 GB = ~31 GB  /  240 GB  →  fine
#   vCPUs  : 16 (atlas) + 4 (camel) = 20 / 20
#
# CAT disabled: reduces camel's per-step GPU compute to keep atlas
#   throughput undisturbed.  CAT triples compute per step (3 chunk passes).
#
# Sizing:
#   25M params  |  batch 128  |  bf16
#   ~2.5 it/s alongside atlas  →  45k steps ≈ 5 h
# ============================================================

experiment:
  name: camel_mi300x
  description: >
    CAMEL IllustrisTNG cosmological simulation (PartType0 gas particles).
    25M param model, batch 128, bf16, 45k steps (~5 h parallel with atlas).

model:
  d_model:    512
  n_layers:   8
  n_heads:    8
  d_ff:       2048
  dropout:    0.1
  vocab_size: 256
  # TDT is critical for CAMEL: electron_abundance is always in [0,1] so
  # sign byte is always zero — TDT captures this with zero embedding cost.
  use_tdt:    true

compressive_memory:
  window_size:      512
  compression_rate: 4

# CAT disabled for parallel run: keeps camel's GPU footprint small so
# atlas throughput is not reduced.  Re-enable (and raise max_steps)
# if running camel alone on the full GPU.
cat:
  enabled:     false
  chunk_sizes: [128, 256, 512]

training:
  batch_size:               128
  grad_accumulation_steps:  1
  learning_rate:            3e-4
  max_steps:                45000     # ~5 h at ~2.5 it/s alongside atlas
  warmup_steps:             450       # 1% of 45k
  grad_clip:                1.0
  weight_decay:             0.01
  mixed_precision:          true
  gradient_checkpointing:   false
  compile_model:            false
  seed:                     123

data:
  window_size: 512
  stride:      256
  num_workers: 4       # 4 workers (16 atlas + 4 camel = 20 vCPUs total)
  streaming:   false
  preload:     true    # load ~15 GB camel_train.bin into RAM; 240 GB avail, no issue

paths:
  train_data:     experiments/camel_experiment/data/camel_train.bin
  val_data:       experiments/camel_experiment/data/camel_val.bin
  checkpoint_dir: experiments/camel_experiment/checkpoints/
  log_dir:        experiments/camel_experiment/runs/mi300x/

evaluation:
  test_data:     experiments/camel_experiment/data/camel_test.bin
  eval_interval: 5000
  eval_batches:  200

logging:
  log_interval:  100
  save_interval: 10000
