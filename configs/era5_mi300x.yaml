
# ============================================================
# AMD MI300X  —  ERA5 Atmospheric Reanalysis  (parallel job 3 of 4)
# ------------------------------------------------------------
# Data  : ECMWF ERA5, float32 pressure-level grids (T, u, v, z).
#         ~100–500 MB per variable-month; export via cdsapi.
# Download:
#   pip install cdsapi
#   python experiments/era5_experiment/download.py --all-steps
#
# Runs concurrently alongside atlas/camel/ligo on the same GPU.
# ============================================================

experiment:
  name: era5_mi300x
  description: >
    ERA5 global atmospheric reanalysis (temperature + wind, float32).
    25M param model, batch 128, bf16, 500k steps.

model:
  d_model:    512
  n_layers:   8
  n_heads:    8
  d_ff:       2048
  dropout:    0.1
  vocab_size: 256
  # TDT: ERA5 fields have strong spatial autocorrelation in exponent bytes.
  # Typed tables disentangle pressure-level structure from horizontal fields.
  use_tdt:    true

compressive_memory:
  window_size:      512
  compression_rate: 4

cat:
  enabled:     true
  chunk_sizes: [128, 256, 512]

training:
  batch_size:               128
  grad_accumulation_steps:  1
  learning_rate:            3e-4
  max_steps:                500000
  warmup_steps:             5000
  grad_clip:                1.0
  weight_decay:             0.01
  mixed_precision:          true
  gradient_checkpointing:   false
  compile_model:            false
  seed:                     456

data:
  window_size: 512
  stride:      256
  num_workers: 4
  streaming:   true

paths:
  train_data:     experiments/era5_experiment/data/era5_train.bin
  val_data:       experiments/era5_experiment/data/era5_val.bin
  checkpoint_dir: experiments/era5_experiment/checkpoints/
  log_dir:        experiments/era5_experiment/runs/mi300x/

evaluation:
  test_data:     experiments/era5_experiment/data/era5_test.bin
  eval_interval: 5000
  eval_batches:  200

logging:
  log_interval:  100
  save_interval: 10000
