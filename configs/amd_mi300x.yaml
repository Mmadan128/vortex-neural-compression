# python scripts/train.py --config configs/amd_mi300x.yaml

model:
  d_model:    1024
  n_layers:   16
  n_heads:    16
  d_ff:       4096
  dropout:    0.1
  vocab_size: 256

compressive_memory:
  window_size:      512
  compression_rate: 4

training:
  batch_size:      128
  learning_rate:   3e-4
  max_steps:       200000
  warmup_steps:    4000
  grad_clip:       1.0
  weight_decay:    0.01
  mixed_precision: true
  seed:            42

data:
  window_size: 512
  stride:      256
  num_workers: 4
  streaming:   false

paths:
  train_data:     experiments/atlas_experiment/data/atlas_200m.bin
  val_data:       experiments/atlas_experiment/data/atlas_val.bin
  checkpoint_dir: experiments/atlas_experiment/checkpoints/
  log_dir:        experiments/atlas_experiment/runs/
