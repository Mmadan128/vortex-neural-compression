
experiment:
  name: atlas_experiment
  description: >
    Byte-level neural compression on ATLAS FTAG b-tagging jet data.
    ttbar medium dataset (~13 GB) with 80/10/10 train/val/test split.
    Source: ATLAS-FTAG-2023-05 (eospublic.cern.ch)

model:
  d_model:    1024
  n_layers:   16
  n_heads:    16
  d_ff:       4096
  dropout:    0.1
  vocab_size: 256

compressive_memory:
  window_size:      512
  compression_rate: 4

training:
  batch_size:               128
  grad_accumulation_steps:  1
  learning_rate:            3e-4
  max_steps:                300000
  warmup_steps:             6000
  grad_clip:                1.0
  weight_decay:             0.01
  mixed_precision:          true
  gradient_checkpointing:   false
  compile_model:            false
  seed:                     42

data:
  window_size: 512
  stride:      256
  num_workers: 0
  streaming:   true

paths:
  train_data:     experiments/atlas_experiment/data/atlas_train.bin
  val_data:       experiments/atlas_experiment/data/atlas_val.bin
  checkpoint_dir: experiments/atlas_experiment/checkpoints/
  log_dir:        experiments/atlas_experiment/runs/

evaluation:
  test_data:     experiments/atlas_experiment/data/atlas_test.bin
  eval_interval: 5000
  eval_batches:  200

logging:
  log_interval:  50
  save_interval: 5000