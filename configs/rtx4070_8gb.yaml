
model:
  d_model:    512
  n_layers:   8
  n_heads:    8
  d_ff:       2048
  dropout:    0.1
  vocab_size: 256

compressive_memory:
  window_size:      512
  compression_rate: 4

training:
  batch_size:               6
  grad_accumulation_steps:  8
  learning_rate:            3e-4
  max_steps:                300000
  warmup_steps:             6000
  grad_clip:                1.0
  weight_decay:             0.01
  mixed_precision:          true
  gradient_checkpointing:   true
  compile_model:            false
  seed:                     42

data:
  window_size: 512
  stride:      128
  num_workers: 4
  streaming:   false

paths:
  train_data:     experiments/atlas_experiment/data/atlas_200m.bin
  val_data:       experiments/atlas_experiment/data/atlas_val.bin
  checkpoint_dir: experiments/atlas_experiment/checkpoints/
  log_dir:        experiments/atlas_experiment/runs/