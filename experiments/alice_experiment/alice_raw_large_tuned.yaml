experiment:
  name: alice_raw_large_tuned
  description: >
    Large ALICE raw-byte corpus training with CAT enabled,
    tuned for higher throughput on AMD Instinct MI300X.

model:
  d_model: 512
  n_layers: 8
  n_heads: 8
  d_ff: 2048
  dropout: 0.1
  vocab_size: 256
  use_tdt: true

compressive_memory:
  window_size: 512
  compression_rate: 4

cat:
  enabled: true
  chunk_sizes: [256, 512]

training:
  batch_size: 384
  grad_accumulation_steps: 1
  learning_rate: 3e-4
  max_steps: 300000
  warmup_steps: 6000
  grad_clip: 1.0
  weight_decay: 0.01
  mixed_precision: true
  gradient_checkpointing: false
  compile_model: true
  seed: 42

data:
  window_size: 512
  stride: 512
  num_workers: 12
  streaming: false
  preload: true

paths:
  train_data: experiments/alice_experiment/data/alice_raw_train.bin
  val_data: experiments/alice_experiment/data/alice_raw_val.bin
  checkpoint_dir: experiments/alice_experiment/checkpoints_large_tuned/
  log_dir: experiments/alice_experiment/runs_large_tuned/

evaluation:
  test_data: experiments/alice_experiment/data/alice_raw_test.bin
  eval_interval: 1000
  eval_batches: 50

logging:
  log_interval: 100
  save_interval: 10000
