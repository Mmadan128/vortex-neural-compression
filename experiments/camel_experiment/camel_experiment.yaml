experiment:
  name: camel_experiment
  description: >
    CAMEL IllustrisTNG PartType0 data converted to float32 binary features.
    Local GPU smoke-test profile (small model, short run) before MI300X.

model:
  d_model:    256
  n_layers:   4
  n_heads:    4
  d_ff:       1024
  dropout:    0.1
  vocab_size: 256
  use_tdt:    true

compressive_memory:
  window_size:      512
  compression_rate: 4

cat:
  enabled:     false
  chunk_sizes: [128, 256, 512]

training:
  batch_size:               8
  grad_accumulation_steps:  2
  learning_rate:            3e-4
  max_steps:                3000
  warmup_steps:             100
  grad_clip:                1.0
  weight_decay:             0.01
  mixed_precision:          true
  gradient_checkpointing:   false
  compile_model:            false
  seed:                     42

data:
  window_size: 512
  stride:      256
  num_workers: 4
  streaming:   false

paths:
  train_data:     experiments/camel_experiment/data/camel_train.bin
  val_data:       experiments/camel_experiment/data/camel_val.bin
  checkpoint_dir: experiments/camel_experiment/checkpoints/
  log_dir:        experiments/camel_experiment/runs/

evaluation:
  test_data:      experiments/camel_experiment/data/camel_test.bin
  eval_interval:  500
  eval_batches:   50

logging:
  log_interval:  50
  save_interval: 5000
