# Vortex-Codec — ATLAS experiment configuration
# Run: python scripts/train.py --config experiments/atlas_experiment/config.yaml

experiment:
  name: atlas_experiment
  description: >
    Byte-level neural compression on ATLAS FTAG b-tagging jet data.
    Structured dtype: 30 fields (pt, eta, GN2v01_pb, DL1dv01_pb, kinematics, labels).
    Source: root://eospublic.cern.ch//eos/opendata/atlas/datascience/ATLAS-FTAG-2023-05/

model:
  d_model:    512
  n_layers:   8
  n_heads:    8
  d_ff:       2048
  dropout:    0.1
  vocab_size: 256

compressive_memory:
  window_size:      512
  compression_rate: 4

training:
  batch_size:      32
  learning_rate:   3e-4
  max_steps:       100000
  warmup_steps:    4000
  grad_clip:       1.0
  weight_decay:    0.01
  mixed_precision: true
  seed:            42

data:
  window_size: 512
  stride:      256
  num_workers: 4
  streaming:   false   # set true for very large files

paths:
  # Paths are relative to repo root
  train_data:     experiments/atlas_experiment/data/atlas_200m.bin
  val_data:       experiments/atlas_experiment/data/atlas_val.bin
  checkpoint_dir: experiments/atlas_experiment/checkpoints/
  log_dir:        experiments/atlas_experiment/runs/
