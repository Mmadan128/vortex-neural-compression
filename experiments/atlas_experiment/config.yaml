
experiment:
  name: atlas_experiment
  description: >
    Byte-level neural compression on ATLAS FTAG b-tagging jet data.
    ttbar medium dataset (~13 GB) with 80/10/10 train/val/test split.
    Source: ATLAS-FTAG-2023-05 (eospublic.cern.ch)

model:
  d_model:    512
  n_layers:   8
  n_heads:    8
  d_ff:       2048
  dropout:    0.1
  vocab_size: 256
  # Feature 4 — TDT: set true when input is raw IEEE-754 float32 binary
  # (e.g. ATLAS HEP data). Four per-type embedding tables capture the
  # distinct entropy profiles of sign, exponent and mantissa bytes.
  use_tdt: true

compressive_memory:
  window_size:      512
  compression_rate: 4

# Feature 2 — CAT Dynamic Chunking
# Wraps the model to train on multiple chunk sizes simultaneously.
# At test time pass chunk_size= to control quality vs compute without retraining.
cat:
  enabled:     true
  chunk_sizes: [128, 256, 512]

training:
  batch_size:               6
  grad_accumulation_steps:  8
  learning_rate:            3e-4
  max_steps:                300000
  warmup_steps:             6000
  grad_clip:                1.0
  weight_decay:             0.01
  mixed_precision:          true
  gradient_checkpointing:   true
  compile_model:            false
  seed:                     42

data:
  window_size: 512
  stride:      256
  num_workers: 4
  streaming:   false

paths:
  train_data:     experiments/atlas_experiment/data/atlas_train.bin
  val_data:       experiments/atlas_experiment/data/atlas_val.bin
  checkpoint_dir: experiments/atlas_experiment/checkpoints/
  log_dir:        experiments/atlas_experiment/runs/

evaluation:
  test_data:      experiments/atlas_experiment/data/atlas_test.bin
  eval_interval:  2000
  eval_batches:   200

logging:
  log_interval:  50
  save_interval: 5000